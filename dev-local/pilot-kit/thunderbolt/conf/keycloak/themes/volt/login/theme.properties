# Login theme for the pilot. Inherits everything from Keycloak's own theme and
# only replaces what identifies the product: the header wordmark, the accent
# colour and the background. Inheriting rather than forking means a Keycloak
# upgrade keeps working — a copied template would silently drift from the server
# that renders it.
parent=keycloak
import=common/keycloak

# Russian first. The realm already declares ru/en; this makes the page itself
# default to ru even before a user has a locale of their own.
locales=ru,en
defaultLocale=ru

styles=css/login.css css/volt.css

# The wordmark is text, not an image: no asset to ship, and it renders correctly
# at any zoom and in a dark theme.
kcLogoIdP-volt=fa fa-bolt
