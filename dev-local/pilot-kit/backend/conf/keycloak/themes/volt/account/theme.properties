# Account console for the pilot — where a user lands to change their own password.
#
# Keycloak 26 serves this as a React app under the `keycloak.v3` theme, so this inherits
# it and only adds a stylesheet. Forking the templates would break on the next upgrade,
# and there is nothing here worth that risk.
parent=keycloak.v3

locales=ru,en
defaultLocale=ru

styles=css/volt-account.css
