[test]
# The third entry resets the fork's process-wide state before every test: bun
# runs one process for the whole suite, so a module store written by one file is
# still written when the next starts. See fork/testing/reset-process-state.ts.
preload = [
  "../happydom.ts",
  "./fork/local-mode/test-env.ts",
  "./fork/testing/reset-process-state.ts",
  "./testing-library.ts",
]

# Fork: name the SVG loader explicitly. Left to the default, bun hands an importer
# a record WITHOUT its default export once a graph grows past some size - the
# failure reads "Missing 'default' export in module .../logo.svg" and aborts the whole
# FILE between tests. It only bit single-file runs (the full suite loads the asset
# early and keeps it), which is exactly the run the docs tell people to use while
# working on one test, so it looked like flakiness for a while.
[loader]
".svg" = "file"
