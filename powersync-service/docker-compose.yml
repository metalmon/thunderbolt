services:
  web:
    restart: unless-stopped
    # Fork web container: builds the frontend (demo/consumer/anonymous flags) and
    # serves it via nginx same-origin proxy for /v1 and /powersync. See
    # dev-local/docker/README-web-demo.md.
    build:
      context: ../
      dockerfile: dev-local/docker/web.Dockerfile
      args:
        # Keycloak/OIDC: redirect unauthenticated users to the IdP (no consumer
        # login), and turn off anonymous + waitlist-bypass so the SSO gate applies.
        VITE_AUTH_MODE: sso
        VITE_AUTH_ENABLE_ANONYMOUS: "false"
        VITE_BYPASS_WAITLIST: "false"
    depends_on:
      - backend
      - powersync
    environment:
      # The nginx template reads these; the image carries the same values as
      # ENV defaults. Naming them here too means a config change and an image
      # rebuild no longer have to travel together — a renamed variable in the
      # template would otherwise render an empty upstream host against a stale
      # image, and nginx answers 502 without saying why.
      VOLT_BACKEND_HOST: backend
      VOLT_BACKEND_PORT: 8000
      VOLT_POWERSYNC_HOST: powersync
      VOLT_POWERSYNC_PORT: 8080
    ports:
      - "${WEB_PORT:-3000}:80"

  tls:
    restart: unless-stopped
    # TLS terminator for on-prem deployments (no tunnel in front). Opt-in via
    # the `tls` profile so certificate-less runs are unaffected:
    #   docker compose --profile tls up -d
    # Requires fullchain.pem + privkey.pem in VOLT_TLS_CERT_DIR. See
    # dev-local/docker/README-pilot-tls.md.
    image: nginx:alpine
    profiles: ["tls"]
    depends_on:
      - web
    environment:
      # Must equal the name baked into the client build (VITE_THUNDERBOLT_CLOUD_URL)
      # and the SAN of the mounted certificate.
      # Falls back to nginx's catch-all rather than being declared required: a
      # `${VAR:?}` anywhere in this file fails interpolation for EVERY compose
      # command, including ones that never touch this profile.
      VOLT_TLS_SERVER_NAME: ${VOLT_TLS_SERVER_NAME:-_}
      VOLT_TLS_UPSTREAM_HOST: web
      VOLT_TLS_UPSTREAM_PORT: 80
      VOLT_TLS_KEYCLOAK_HOST: keycloak
      VOLT_TLS_KEYCLOAK_PORT: 8080
    volumes:
      - ../dev-local/docker/tls-nginx.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ${VOLT_TLS_CERT_DIR:-./certs}:/etc/nginx/certs:ro
    ports:
      - "${VOLT_TLS_HTTP_PORT:-80}:80"
      - "${VOLT_TLS_HTTPS_PORT:-443}:443"
      # Keycloak on the same name/certificate, its own port (see tls-nginx template).
      - "${VOLT_TLS_KEYCLOAK_HTTPS_PORT:-8443}:8443"

  backend:
    restart: unless-stopped
    # IPv6 is unreachable on this host, but Gemini (generativelanguage.googleapis.com)
    # resolves AAAA-first, so the upstream WebSocket to Gemini picks IPv6 and hangs
    # (voice: /v1/gemini-live opens then closes with 0 frames). Disable IPv6 in the
    # container so DNS/connect falls back to IPv4.
    sysctls:
      - net.ipv6.conf.all.disable_ipv6=1
      - net.ipv6.conf.default.disable_ipv6=1
    depends_on:
      postgres:
        condition: service_healthy
      searxng:
        condition: service_started
      firecrawl-api:
        condition: service_started
      keycloak:
        condition: service_started
    build:
      context: ../
      dockerfile: deploy/docker/backend.Dockerfile
    env_file:
      # Reuse the dev env (secrets, auth mode, CORS); in-network overrides below.
      - ../backend/.env
      # Git-ignored demo secrets — OpenRouter key(s) + optional OPENROUTER_FREE_RPM.
      # `required: false` so the stack still boots without it (the free models just
      # return 503 until a key is set). Create powersync-service/secrets.env
      # (see secrets.env.example / README-web-demo.md).
      - path: ./secrets.env
        required: false
    environment:
      # backend/.env points at the host-mapped localhost:5433, unreachable from
      # inside the compose network — use the service-name host instead.
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/postgres
      # Web-demo origin. All auth/callback/CORS/PowerSync URLs derive from
      # ${PUBLIC_URL} so the SPA, /v1, and /powersync are same-origin behind one
      # tunnel. Default localhost:3000 for local use; set PUBLIC_URL to the tunnel
      # URL for external access. POWERSYNC_URL is returned to the browser, so it
      # must be the public origin (not the internal service host).
      APP_URL: ${PUBLIC_URL:-http://localhost:3000}
      BETTER_AUTH_URL: ${PUBLIC_URL:-http://localhost:3000}
      TRUSTED_ORIGINS: ${PUBLIC_URL:-http://localhost:3000},${KEYCLOAK_PUBLIC_URL:-http://localhost:8180},http://keycloak:8080
      # Web-demo origin (${PUBLIC_URL}) plus the Tauri desktop origins, so the
      # standalone binary (origin http://tauri.localhost) can call /v1 directly
      # when native-fetch is off. Desktop native-fetch bypasses CORS entirely.
      CORS_ORIGINS: ${PUBLIC_URL:-http://localhost:3000},http://tauri.localhost,tauri://localhost,http://localhost:1420
      POWERSYNC_URL: ${PUBLIC_URL:-http://localhost:3000}/powersync
      # Outbound egress proxy (HTTPS_PROXY/HTTP_PROXY) is set in secrets.env for
      # cloud APIs that the closed perimeter only reaches via Proxifier's upstream
      # proxy (Proxifier hooks host processes, not this container). Keep ALL
      # internal service traffic OFF that proxy — otherwise backend→postgres/
      # keycloak/powersync/searxng/firecrawl would be tunnelled out (breaking OIDC
      # discovery, search, scrape, sync). Match by compose service name.
      NO_PROXY: localhost,127.0.0.1,::1,postgres,keycloak,powersync,searxng,firecrawl-api,firecrawl-worker,firecrawl-redis,firecrawl-puppeteer,backend
      no_proxy: localhost,127.0.0.1,::1,postgres,keycloak,powersync,searxng,firecrawl-api,firecrawl-worker,firecrawl-redis,firecrawl-puppeteer,backend
      # OIDC mode: no anonymous sessions — everyone signs in via Keycloak.
      AUTH_ALLOW_ANONYMOUS: "false"
      # Fork: Keycloak OIDC. AUTH_MODE=oidc overrides backend/.env's `consumer`.
      # Issuer split — the browser-facing issuer (published :8180) vs the internal
      # discovery/backchannel over the compose net (keycloak:8080). The Keycloak
      # service pins KC_HOSTNAME + BACKCHANNEL_DYNAMIC so the `iss` claim stays
      # http://localhost:8180/realms/volt for both the browser and the backend.
      AUTH_MODE: oidc
      OIDC_CLIENT_ID: volt-app
      OIDC_CLIENT_SECRET: volt-dev-secret
      # Browser-facing issuer = Keycloak's own public URL (upstream recipe:
      # OIDC_ISSUER must equal the keycloak service's KC_HOSTNAME). Defaults to the
      # published :8180 for local (browser on the host); for remote access set
      # KEYCLOAK_PUBLIC_URL to Keycloak's own tunnel/domain (a SECOND tunnel to
      # :8180) — Keycloak keeps its own origin rather than riding the app tunnel.
      OIDC_ISSUER: ${KEYCLOAK_PUBLIC_URL:-http://localhost:8180}/realms/volt
      OIDC_DISCOVERY_URL: http://keycloak:8080/realms/volt/.well-known/openid-configuration
      # OPENROUTER_API_KEYS / OPENROUTER_FREE_RPM come from the git-ignored
      # secrets.env above (not hardcoded here, so a shell/env-file value wins).
      #
      # Trust the deployment's private CA. This matters more than it looks: a
      # Custom model/MCP endpoint on a NON-loopback host (a LAN model server, for
      # instance) is routed through the universal proxy, not the client's native
      # fetch — see the dispatch in src/ai/fetch.ts — so the TLS hop to it is made
      # HERE, by Bun, and Bun's own root store knows nothing about an internal CA.
      # Empty is safe (Bun ignores it); point it at the mounted CA to enable.
      # Verified: without it the hop fails with "unable to verify the first
      # certificate", with it the same request returns 200.
      NODE_EXTRA_CA_CERTS: ${VOLT_BACKEND_EXTRA_CA:-}
      # Fork: voltd agent auto-discovery. VOLTD_URL and VOLTD_ISSUER come from
      # secrets.env (the env_file above) and must NOT be named here: an
      # `environment:` entry wins over env_file, and ${VOLTD_URL:-} interpolates
      # from .env / the shell — not from secrets.env — so naming it silently
      # overrode the gateway address with an empty string and left the feature
      # inert with everything else correctly configured.
      #
      # Unset VOLTD_URL does leave the whole feature inert on purpose — no
      # provider registered, no relay route, issuer surface served only if the
      # keys are present. The keys are PATHS, not values: a PEM is multi-line so
      # env_file cannot carry one, and a private key in an env var leaks into
      # `docker inspect`.
      VOLTD_JWT_PRIVATE_KEY_FILE: ${VOLTD_JWT_PRIVATE_KEY_FILE:-/etc/volt/voltd-keys/signing.key.pem}
      VOLTD_JWT_PUBLIC_KEY_FILE: ${VOLTD_JWT_PUBLIC_KEY_FILE:-/etc/volt/voltd-keys/signing.pub.pem}
      # Dotted path to the group claim in the IdP's token. Keycloak's Group
      # Membership mapper emits `groups`; realm roles would be
      # `realm_access.roles`.
      VOLTD_GROUPS_CLAIM: ${VOLTD_GROUPS_CLAIM:-groups}
    volumes:
      # Same directory the `tls` service reads its certificate from; mounted so
      # VOLT_BACKEND_EXTRA_CA can name the CA inside it, e.g.
      # /etc/volt/certs/ca.crt. Harmless when the directory holds nothing.
      - ${VOLT_TLS_CERT_DIR:-./certs}:/etc/volt/certs:ro
      # ES256 keypair the backend signs voltd access tokens with. Git-ignored;
      # generate per deployment (see README-pilot-tls.md).
      - ./voltd-keys:/etc/volt/voltd-keys:ro
    # Lets the container (and anything sharing its network namespace, e.g.
    # voltd-forward) address the host. `extra_hosts` is rejected on a service
    # using `network_mode: service:*`, so it has to live here.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      # Stays on 0.0.0.0, unlike the pilot kit's, and must: the voltd stand's
      # own socat sidecar reaches our issuer (discovery + JWKS) through
      # host.docker.internal, which does not resolve to a loopback-bound port.
      # Binding this to 127.0.0.1 "for safety" silently breaks voltd's ability to
      # verify our tokens, with "pair first" as the only symptom. Dev machine
      # only — the kit publishes 8000 on loopback.
      - 8000:8000

  # Dev-only: makes the voltd gateway reachable from the backend container at
  # the one address its certificate is valid for. Their server cert carries only
  # `DNS:localhost, IP:127.0.0.1`, and inside a container 127.0.0.1 is the
  # container itself — so forward it into the BACKEND's own network namespace,
  # which is the mirror image of the socat sidecar they run to reach our issuer.
  # Opt-in; a pilot gateway has a real name and a certificate for it.
  #   docker compose --profile voltd-dev up -d voltd-forward
  #
  # ⚠ While this runs, the backend's loopback is NO LONGER local: 127.0.0.1:8453
  # inside the container reaches the host. Code that treats loopback as "cannot
  # leave this machine" is weaker for that one port — `isSecureGatewayUrl` permits
  # cleartext ws:// to loopback on exactly that reasoning. Acceptable for a dev
  # profile aimed at one known gateway; do not carry it into a deployment, and do
  # not widen it to a port range.
  voltd-forward:
    profiles: ["voltd-dev"]
    image: alpine/socat:latest
    restart: unless-stopped
    network_mode: "service:backend"
    depends_on:
      - backend
    command: >-
      TCP-LISTEN:${VOLTD_FORWARD_PORT:-8453},fork,reuseaddr,bind=127.0.0.1
      TCP:${VOLTD_FORWARD_TARGET:-host.docker.internal}:${VOLTD_FORWARD_PORT:-8453}

  keycloak:
    restart: unless-stopped
    # Fork: self-hosted OIDC IdP for AUTH_MODE=oidc. start-dev + embedded H2 (dev;
    # the `volt` realm is imported from ./keycloak/realm.json on FIRST boot only —
    # see the keycloak_data volume below).
    # KC_HOSTNAME pins the browser-facing base URL so the `iss` claim is stable;
    # BACKCHANNEL_DYNAMIC lets the backend reach token/JWKS over the compose net
    # (keycloak:8080) without hairpinning through the published host port.
    image: quay.io/keycloak/keycloak:26.0
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HTTP_ENABLED: "true"
      # Own public URL (upstream recipe). Must equal the backend's OIDC_ISSUER
      # origin. Default = published :8180 (local); override with KEYCLOAK_PUBLIC_URL
      # (its own tunnel/domain) for remote. BACKCHANNEL_DYNAMIC keeps token/JWKS on
      # the internal keycloak:8080 for the backend, so this URL is browser-only.
      KC_HOSTNAME: ${KEYCLOAK_PUBLIC_URL:-http://localhost:8180}
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HEALTH_ENABLED: "true"
      # Honour X-Forwarded-Proto/Host from the `tls` service so Keycloak builds
      # https issuer + redirect URLs when it sits behind TLS termination. Harmless
      # without the proxy (nothing sets the headers), so it is unconditional.
      KC_PROXY_HEADERS: xforwarded
    volumes:
      - ./keycloak/realm.json:/opt/keycloak/data/import/realm.json:ro
      # Keep the embedded H2 across container recreates. Without it every
      # `--force-recreate` takes the test users with it — which is exactly how the
      # avk login disappeared mid-session once already.
      #
      # A named volume rather than a bind mount: this path belongs to uid 1000 in
      # the image and Keycloak never chowns it, so a host directory Docker creates
      # root-owned makes the container fail to start on any Linux host. Docker seeds
      # a named volume from the image, ownership included.
      #
      # The trade: realm.json is now imported on FIRST boot only. Editing it later
      # changes nothing until `docker compose down -v`.
      - keycloak_data:/opt/keycloak/data
    ports:
      - "8180:8080"

  powersync:
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    image: docker.io/journeyapps/powersync-service:latest
    command: ["start", "-r", "unified"]
    volumes:
      - ./config/config.yaml:/config/config.yaml
    environment:
      POWERSYNC_CONFIG_PATH: /config/config.yaml
    ports:
      - 8080:8080

  postgres:
    image: docker.io/library/postgres:18-alpine
    restart: always
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_DB=postgres
      - POSTGRES_PASSWORD=postgres
      - PGPORT=5432
    volumes:
      # postgres:18+ expects the volume mount at /var/lib/postgresql (without the /data
      # suffix); the image manages a version-specific subdirectory like 18/docker inside.
      # Mounting at /var/lib/postgresql/data — the postgres:17 default — makes 18+ refuse
      # to start with "(unused mount/volume)". See docker-library/postgres#1259.
      - pg_data:/var/lib/postgresql
      - ./init-db:/docker-entrypoint-initdb.d
    ports:
      - "5433:5432"
    command: ["postgres", "-c", "wal_level=logical"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # --- Web search (SearXNG) + scrape (Firecrawl) — Phase 3. The backend routes
  # /v1/search and /pro/fetch-content here when SEARXNG_URL/FIRECRAWL_URL are set
  # (in secrets.env); unset ⇒ Exa fallback. See README-web-demo.md.
  searxng:
    restart: unless-stopped
    image: searxng/searxng:latest
    # host-only публикация для Volt web_search (localhost:24080); внутренний
    # доступ backend↔searxng по имени сервиса не меняется.
    ports:
      - "127.0.0.1:24080:8080"
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
    environment:
      SEARXNG_BASE_URL: http://localhost:8080/

  firecrawl-redis:
    restart: unless-stopped
    image: redis:alpine
    command: redis-server --bind 0.0.0.0

  firecrawl-puppeteer:
    restart: unless-stopped
    # Built locally from E:\firecrawl-simple (`docker compose build`); Phase 3a → ghcr.io/metalmon.
    image: trieve/puppeteer-service-ts
    dns:
      - 1.1.1.1
      - 8.8.8.8
    environment:
      PORT: "3000"
      MAX_CONCURRENCY: "2"

  firecrawl-api:
    restart: unless-stopped
    image: trieve/firecrawl
    # host-only публикация для Volt firecrawl-mcp (localhost:3002); внутренний
    # доступ backend↔firecrawl-api по имени сервиса не меняется.
    ports:
      - "127.0.0.1:3002:3002"
    depends_on:
      - firecrawl-redis
      - firecrawl-puppeteer
    environment:
      REDIS_URL: redis://firecrawl-redis:6379
      REDIS_RATE_LIMIT_URL: redis://firecrawl-redis:6379
      PLAYWRIGHT_MICROSERVICE_URL: http://firecrawl-puppeteer:3000/scrape
      PORT: "3002"
      HOST: 0.0.0.0
      BULL_AUTH_KEY: thunderbolt-demo-bull
      TEST_API_KEY: ""
    command: ["pnpm", "run", "start:production"]

  firecrawl-worker:
    restart: unless-stopped
    image: trieve/firecrawl
    depends_on:
      - firecrawl-redis
      - firecrawl-puppeteer
      - firecrawl-api
    environment:
      REDIS_URL: redis://firecrawl-redis:6379
      REDIS_RATE_LIMIT_URL: redis://firecrawl-redis:6379
      PLAYWRIGHT_MICROSERVICE_URL: http://firecrawl-puppeteer:3000/scrape
      PORT: "3002"
      HOST: 0.0.0.0
      BULL_AUTH_KEY: thunderbolt-demo-bull
    command: ["pnpm", "run", "workers"]

volumes:
  pg_data:
  keycloak_data:
