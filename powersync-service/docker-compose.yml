services:
  web:
    restart: unless-stopped
    # Fork web container: builds the frontend (demo/consumer/anonymous flags) and
    # serves it via nginx same-origin proxy for /v1 and /powersync. See
    # dev-local/docker/README-web-demo.md.
    build:
      context: ../
      dockerfile: dev-local/docker/web.Dockerfile
    depends_on:
      - backend
      - powersync
    ports:
      - "${WEB_PORT:-3000}:80"

  backend:
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      searxng:
        condition: service_started
      firecrawl-api:
        condition: service_started
    build:
      context: ../
      dockerfile: deploy/docker/backend.Dockerfile
    env_file:
      # Reuse the dev env (secrets, auth mode, CORS); in-network overrides below.
      - ../backend/.env
      # Git-ignored demo secrets — OpenRouter key(s) + optional OPENROUTER_FREE_RPM.
      # `required: false` so the stack still boots without it (the free models just
      # return 503 until a key is set). Create powersync-service/openrouter.env
      # (see openrouter.env.example / README-web-demo.md).
      - path: ./openrouter.env
        required: false
    environment:
      # backend/.env points at the host-mapped localhost:5433, unreachable from
      # inside the compose network — use the service-name host instead.
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/postgres
      # Web-demo origin. All auth/callback/CORS/PowerSync URLs derive from
      # ${PUBLIC_URL} so the SPA, /v1, and /powersync are same-origin behind one
      # tunnel. Default localhost:3000 for local use; set PUBLIC_URL to the tunnel
      # URL for external access. POWERSYNC_URL is returned to the browser, so it
      # must be the public origin (not the internal service host).
      APP_URL: ${PUBLIC_URL:-http://localhost:3000}
      BETTER_AUTH_URL: ${PUBLIC_URL:-http://localhost:3000}
      TRUSTED_ORIGINS: ${PUBLIC_URL:-http://localhost:3000}
      # Web-demo origin (${PUBLIC_URL}) plus the Tauri desktop origins, so the
      # standalone binary (origin http://tauri.localhost) can call /v1 directly
      # when native-fetch is off. Desktop native-fetch bypasses CORS entirely.
      CORS_ORIGINS: ${PUBLIC_URL:-http://localhost:3000},http://tauri.localhost,tauri://localhost,http://localhost:1420
      POWERSYNC_URL: ${PUBLIC_URL:-http://localhost:3000}/powersync
      AUTH_ALLOW_ANONYMOUS: "true"
      # OPENROUTER_API_KEYS / OPENROUTER_FREE_RPM come from the git-ignored
      # openrouter.env above (not hardcoded here, so a shell/env-file value wins).
    ports:
      - 8000:8000

  powersync:
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    image: docker.io/journeyapps/powersync-service:latest
    command: ["start", "-r", "unified"]
    volumes:
      - ./config/config.yaml:/config/config.yaml
    environment:
      POWERSYNC_CONFIG_PATH: /config/config.yaml
    ports:
      - 8080:8080

  postgres:
    image: docker.io/library/postgres:18-alpine
    restart: always
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_DB=postgres
      - POSTGRES_PASSWORD=postgres
      - PGPORT=5432
    volumes:
      # postgres:18+ expects the volume mount at /var/lib/postgresql (without the /data
      # suffix); the image manages a version-specific subdirectory like 18/docker inside.
      # Mounting at /var/lib/postgresql/data — the postgres:17 default — makes 18+ refuse
      # to start with "(unused mount/volume)". See docker-library/postgres#1259.
      - pg_data:/var/lib/postgresql
      - ./init-db:/docker-entrypoint-initdb.d
    ports:
      - "5433:5432"
    command: ["postgres", "-c", "wal_level=logical"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # --- Web search (SearXNG) + scrape (Firecrawl) — Phase 3. The backend routes
  # /v1/search and /pro/fetch-content here when SEARXNG_URL/FIRECRAWL_URL are set
  # (in openrouter.env); unset ⇒ Exa fallback. See README-web-demo.md.
  searxng:
    restart: unless-stopped
    image: searxng/searxng:latest
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
    environment:
      SEARXNG_BASE_URL: http://localhost:8080/

  firecrawl-redis:
    restart: unless-stopped
    image: redis:alpine
    command: redis-server --bind 0.0.0.0

  firecrawl-puppeteer:
    restart: unless-stopped
    # Built locally from E:\firecrawl-simple (`docker compose build`); Phase 3a → ghcr.io/metalmon.
    image: trieve/puppeteer-service-ts
    dns:
      - 1.1.1.1
      - 8.8.8.8
    environment:
      PORT: "3000"
      MAX_CONCURRENCY: "2"

  firecrawl-api:
    restart: unless-stopped
    image: trieve/firecrawl
    depends_on:
      - firecrawl-redis
      - firecrawl-puppeteer
    environment:
      REDIS_URL: redis://firecrawl-redis:6379
      REDIS_RATE_LIMIT_URL: redis://firecrawl-redis:6379
      PLAYWRIGHT_MICROSERVICE_URL: http://firecrawl-puppeteer:3000/scrape
      PORT: "3002"
      HOST: 0.0.0.0
      BULL_AUTH_KEY: thunderbolt-demo-bull
      TEST_API_KEY: ""
    command: ["pnpm", "run", "start:production"]

  firecrawl-worker:
    restart: unless-stopped
    image: trieve/firecrawl
    depends_on:
      - firecrawl-redis
      - firecrawl-puppeteer
      - firecrawl-api
    environment:
      REDIS_URL: redis://firecrawl-redis:6379
      REDIS_RATE_LIMIT_URL: redis://firecrawl-redis:6379
      PLAYWRIGHT_MICROSERVICE_URL: http://firecrawl-puppeteer:3000/scrape
      PORT: "3002"
      HOST: 0.0.0.0
      BULL_AUTH_KEY: thunderbolt-demo-bull
    command: ["pnpm", "run", "workers"]

volumes:
  pg_data:
