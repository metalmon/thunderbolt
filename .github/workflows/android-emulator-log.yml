name: Android Emulator Log

# Fork-only diagnostic: build an x86_64 debug APK, boot an x86_64 emulator in CI,
# launch the app, and capture logcat — so a crash-on-start can be diagnosed
# without a physical device. No signing/secrets. Prints the filtered crash lines
# to the run log and uploads the full logcat as an artifact.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref to build'
        required: false
        default: 'master'

jobs:
  emulator:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK + NDK
        uses: android-actions/setup-android@v3
        with:
          ndk-version: 26.1.10909125

      - name: Export Android NDK environment
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          NDK_PATH="$ANDROID_SDK_ROOT/ndk/26.1.10909125"
          if [ ! -d "$NDK_PATH" ]; then NDK_PATH=$(ls -d "$ANDROID_SDK_ROOT/ndk/"* | head -1); fi
          echo "NDK_HOME=$NDK_PATH" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=$NDK_PATH" >> $GITHUB_ENV

      - name: Setup Rust + x86_64 Android target
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          target: x86_64-linux-android
          cache: false
          rustflags: ''

      - name: Install dependencies
        run: bun install

      - name: Build x86_64 debug APK
        env:
          RUSTC_WRAPPER: ''
          SCCACHE_DISABLE: '1'
        run: bun tauri android build --apk --debug --target x86_64

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run in emulator and capture logcat
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            set -x
            APK=$(find src-tauri/gen/android/app/build/outputs/apk -iname '*x86*debug*.apk' | head -1)
            if [ -z "$APK" ]; then APK=$(find src-tauri/gen/android/app/build/outputs/apk -iname '*debug*.apk' | head -1); fi
            echo "Installing $APK"
            adb install -r "$APK"
            adb logcat -c
            adb shell monkey -p ru.metalmon.volt.dev -c android.intent.category.LAUNCHER 1 || true
            sleep 25
            echo "=================== CRASH / APP LOG ==================="
            adb logcat -d '*:W' | grep -iE 'volt|tauri|wry|AndroidRuntime|chromium|rustls|panic|FATAL|Exception|abort|libc|DEBUG' | tail -250
            echo "=================== END ==================="
            adb logcat -d > full-logcat.txt

      - name: Upload full logcat
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-logcat
          path: full-logcat.txt
          if-no-files-found: warn
