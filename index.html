<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#000000" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <title>Thunderbolt</title>
  </head>

  <body>
    <script>
      // Apply theme before first paint to prevent flash of white on dark mode.
      // Must stay in sync with the storage keys and logic in
      // src/stores/local-settings-store.ts (theme, and its version-1 migration)
      // and src/api/config-store.ts (the cached /config).
      // The colors mirror --color-background in src/index.css — this is the one
      // unavoidable duplicate of those values (this script runs before the
      // stylesheet loads; src/lib/document-background.ts reads them from CSS at runtime).
      // Operator branding from the cached /config supplies the default theme,
      // background and title, checked against the same patterns and length limit
      // as shared/branding.ts (prePaintRules); the theme fallback order must match
      // ThemeProvider: the user's choice, then branding.defaultThemeMode, then the OS.
      ;(function () {
        var readState = function (key) {
          try {
            return JSON.parse(localStorage.getItem(key) || 'null')
          } catch (e) {
            return null
          }
        }
        // Fork: the store persists under its own key and removes the upstream one
        // (src/fork/storage/local-settings-key.ts). The legacy name stays as a fallback
        // for a profile whose migration has not run yet.
        var settings = readState('volt-local-settings') || readState('thunderbolt-local-settings')
        var config = readState('thunderbolt-config')
        var storedTheme = settings?.state?.theme
        // Before version 1, 'system' was the default rather than a choice (migrateLocalSettings).
        var chosenTheme = storedTheme === 'system' && !(settings.version >= 1) ? null : storedTheme
        var branding = config?.state?.config?.branding || {}
        var themeModes = ['light', 'dark', 'system']
        var defaultTheme = themeModes.indexOf(branding.defaultThemeMode) >= 0 ? branding.defaultThemeMode : null
        var theme = chosenTheme || defaultTheme
        // Fork: 'paper' is a fixed warm theme, so it pins its class and background
        // before paint — it never flashes light or (system-dark) dark first, and the
        // operator's light/dark tokens do not apply to it: the palette IS the theme.
        var isPaper = theme === 'paper'
        var isDark =
          !isPaper && (theme === 'dark' || (theme !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches))
        var modeTokens = isPaper ? {} : (branding.cssVars && branding.cssVars[isDark ? 'dark' : 'light']) || {}
        // Same patterns, theme modes and name limit as shared/branding.ts (prePaintRules);
        // src/prepaint.test.ts keeps them identical.
        var candidate = typeof modeTokens.background === 'string' ? modeTokens.background.trim() : ''
        var isColor =
          /^#(?:[0-9a-f]{3,4}|[0-9a-f]{6}|[0-9a-f]{8})$/i.test(candidate) ||
          /^(?:rgba?|hsla?|oklch|oklab)\((?:[\d.\s%,/+-]|deg|none)+\)$/i.test(candidate)
        var background = isColor ? candidate : isPaper ? '#f0e9dd' : isDark ? '#1b1e1f' : '#f5f2ee'
        document.documentElement.classList.add(isPaper ? 'paper' : isDark ? 'dark' : 'light')
        document.documentElement.style.backgroundColor = background
        document.querySelector('meta[name="theme-color"]')?.setAttribute('content', background)
        var appName = typeof branding.appName === 'string' ? branding.appName.trim() : ''
        if (appName && appName.length <= 60) {
          document.title = appName
        }
      })()
    </script>
    <div id="root"></div>
    <script src="/src/index.tsx" type="module"></script>
  </body>
</html>
