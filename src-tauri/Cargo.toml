[package]
name = "thunderbolt"
version = "0.1.135"
description = "Privacy-respecting AI assistant."
authors = ["Chris Roth <chris@cjroth.com>"]
license = "MPL-2.0"
edition = "2021"
default-run = "thunderbolt"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "thunderbolt_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = []
native_fetch = []

[workspace]
members = []
default-members = ["."]

[[bin]]
name = "thunderbolt"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.6.0", features = [] }

[dependencies]
tauri = { version = "2.11.2", features = [
    "tray-icon",
    "devtools",
    "unstable",            # Required for webview
    "macos-private-api",   # Required for the transparent window + sidebar vibrancy
] }
tauri-plugin-opener = "2.5.4"
tauri-plugin-dialog = "2"
tauri-plugin-os = "2.3.2"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.150"
anyhow = "1.0.99"
tokio = "1.52.3"

# CLI installer: download the prebuilt `thunderbolt` binary + SHA256SUMS and
# verify the checksum before install. rustls (no OpenSSL) matches the rest of the
# app's TLS stack; all three are already transitive deps so no new versions land.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
sha2 = "0.10"
hex = "0.4"
tauri-plugin-devtools = "2.0.1"
# Fork: read roots from the OS trust store instead of the bundled Mozilla set.
# The plugin's default `rustls-tls` feature pulls webpki-roots, so a CA installed
# in the machine store (an on-prem deployment's internal CA) is NOT trusted on the
# native-fetch path — and that path is the default on desktop, because the proxy
# toggle defaults to off (`computeEffectiveProxyEnabled`), which sends every
# non-loopback Custom model/MCP endpoint straight out through this plugin.
# The other names are the plugin's remaining defaults, restated because
# `default-features = false` removes them all.
#
# This is purely additive, and deliberately so. Our own `reqwest` dependency below
# still asks for `rustls-tls`, and Cargo unifies features per crate version, so
# `rustls-tls-webpki-roots` stays enabled alongside `rustls-tls-native-roots` —
# reqwest then loads BOTH sets into one root store (verified with
# `cargo tree -e features -i reqwest@0.12.28`: both `*-no-provider` features
# resolve on). Public roots keep working exactly as before; the OS store is added.
# Do not "tidy" this by dropping `rustls-tls` from the reqwest line below without
# re-checking that resolution.
#
# Android gains nothing here: rustls-native-certs looks in the Unix default paths,
# while Android keeps system CAs elsewhere and hides user-installed ones from apps
# targeting API 24+ without a network_security_config. It does not regress either —
# the bundled roots remain. Android needs rustls-platform-verifier (reqwest 0.13,
# which this plugin has not moved to) plus that manifest file; tracked separately.
tauri-plugin-http = { version = "2.5.9", default-features = false, features = [
    "rustls-tls-native-roots",
    "http2",
    "charset",
    "macos-system-configuration",
    "cookies",
] }
tauri-plugin-process = "2.3.1"
tauri-plugin-fs = "2.4.4"
tauri-plugin-deep-link = "2.4"
tauri-plugin-haptics = "2.3"
tauri-plugin-updater = "2.3"
tauri-plugin-store = "2.4.3"

# Used only in debug builds to install a rustls crypto provider before
# tauri-plugin-devtools' reqwest stack initializes (otherwise iOS dev panics
# at first HTTPS call: "No provider set"). Already a transitive dep via reqwest.
rustls = { version = "0.23", default-features = false, features = ["aws-lc-rs"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2"

[target.'cfg(target_os = "ios")'.dependencies]
objc2-ui-kit = { version = "0.3.2", features = ["UIApplication", "UIWindow", "UIView", "UIInterface", "UIScene", "UIWindowScene"] }
objc2-foundation = "0.3.2"

[profile.dev]
incremental = true # Compile your binary in smaller steps.

[profile.release]
codegen-units = 1 # Allows LLVM to perform better optimization.
lto = true        # Enables link-time-optimizations.
opt-level = "s"   # Prioritizes small binary size. Use `3` if you prefer speed.
panic = "abort"   # Higher performance by disabling panic handlers.
strip = true      # Ensures debug symbols are removed.
